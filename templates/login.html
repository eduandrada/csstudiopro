<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 1.6 Studio Pro - Acceso al Sistema</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0d10;
            --card-bg: #12161c;
            --card-border: #252c37;
            --accent: #f5a623;
            --accent-glow: rgba(245, 166, 35, 0.35);
            --accent-hover: #ffbb45;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --input-bg: #0c0f13;
            --danger: #ff4757;
            --success: #2ed573;
            --font-tactical: 'Chakra Petch', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(245, 166, 35, 0.08) 0%, transparent 60%),
                linear-gradient(180deg, rgba(10, 13, 16, 0.92) 0%, rgba(10, 13, 16, 0.98) 100%),
                url('/static/img/cs_bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 25px var(--accent-glow);
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.4s ease-out;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            padding: 32px 30px 22px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.15);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            background: rgba(245, 166, 35, 0.12);
            border: 1px solid rgba(245, 166, 35, 0.35);
            border-radius: 20px;
            color: var(--accent);
            font-family: var(--font-tactical);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 14px;
        }

        .auth-header h1 {
            font-family: var(--font-tactical);
            font-size: 1.65rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .auth-header h1 span {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .auth-body {
            padding: 28px 30px 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 13px 15px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: var(--font-sans);
            letter-spacing: 0.5px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-wrapper input[type="password"] {
            letter-spacing: 2px;
            font-family: var(--font-mono);
        }

        .toggle-pwd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pwd:hover {
            color: var(--accent);
        }

        /* CHECKBOX RECORDAR SESIÓN */
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            user-select: none;
        }

        .remember-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.84rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .remember-checkbox-label:hover {
            color: var(--text-main);
        }

        .remember-checkbox-label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.2s;
        }

        .remember-checkbox-label input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .remember-checkbox-label input[type="checkbox"]:checked::before {
            content: "✓";
            color: #000;
            font-size: 11px;
            font-weight: 800;
        }

        .security-badge {
            font-size: 0.75rem;
            color: var(--accent);
            font-family: var(--font-mono);
            opacity: 0.9;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #0c0f13;
            border: none;
            border-radius: 6px;
            font-family: var(--font-tactical);
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            box-shadow: 0 4px 18px rgba(245, 166, 35, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(245, 166, 35, 0.42);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: none;
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            animation: shake 0.3s ease;
        }

        .alert-box.error {
            display: block;
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid rgba(255, 71, 87, 0.35);
            color: #ff6b81;
        }

        .alert-box.success {
            display: block;
            background: rgba(46, 213, 115, 0.12);
            border: 1px solid rgba(46, 213, 115, 0.35);
            color: #2ed573;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            max-width: 440px;
        }

        .auth-footer .credits-highlight {
            color: #d1d5db;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }

        .auth-footer .credits-names {
            color: var(--accent);
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-badge">
                <span>🛡️</span> Acceso Táctico • Sistema Cerrado
            </div>
            <h1>CS 1.6 <span>Studio Pro</span></h1>
            <p>Estación de Trabajo & Modding GoldSrc Engine</p>
        </div>

        <div class="auth-body">
            <div id="alert-msg" class="alert-box"></div>

            <!-- FORMULARIO DE LOGIN EXCLUSIVO (SIN REGISTRO) -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Identificador de Operador</label>
                    <div class="input-wrapper">
                        <input type="text" id="login-username" required autocomplete="username" spellcheck="false">
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Clave de Acceso</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" required autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('login-password')" title="Mostrar / Ocultar">👁️</button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="remember-checkbox-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Recordar sesión en este equipo</span>
                    </label>
                    <span class="security-badge">SHA-256</span>
                </div>

                <button type="submit" class="btn-submit" id="btn-login-submit">
                    <span>Entrar al Studio</span>
                </button>
            </form>
        </div>
    </div>

    <div class="auth-footer">
        <div>CS 1.6 Modding & Tuning Studio Pro v4.0 • Edición Segura</div>
        <div class="credits-highlight">
            Desarrollo: <span class="credits-names">Edu Andrada</span> • Créditos: <span class="credits-names">yuyito, Hidden /A/, KYAMI, vANS</span>
        </div>
    </div>

    <script>
        // Carga silenciosa de credenciales maestras por defecto sin mostrar pistas visuales en el diseño
        window.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('login-username');
            const passInput = document.getElementById('login-password');
            if (userInput && !userInput.value) {
                // Pre-rellenado silencioso (la contraseña queda enmascarada con show="*")
                userInput.value = 'cstrike';
            }
            if (passInput && !passInput.value) {
                passInput.value = 'pro';
            }

            // Comprobación de auto-login previo (si ya existe sesión activa)
            checkAutoLogin();
        });

        async function checkAutoLogin() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated) {
                        showAlert('Sesión activa detectada. Ingresando...', 'success');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 250);
                    }
                }
            } catch (e) {
                // Silencioso
            }
        }

        function showAlert(message, type = 'error') {
            const el = document.getElementById('alert-msg');
            el.className = `alert-box ${type}`;
            el.textContent = message;
            el.style.display = 'block';
        }

        function clearAlert() {
            const el = document.getElementById('alert-msg');
            el.className = 'alert-box';
            el.style.display = 'none';
        }

        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('btn-login-submit');
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (!user || !pass) {
                showAlert('Por favor ingresa tu identificador y clave.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> <span>Verificando...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: user, 
                        password: pass,
                        remember_me: rememberMe
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert('¡Acceso concedido! Iniciando Studio...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);
                } else {
                    showAlert(data.error || 'Credenciales incorrectas.');
                }
            } catch (err) {
                showAlert('Error de conexión con el servicio de autenticación.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar al Studio</span>';
            }
        }
    </script>
</body>
</html>
